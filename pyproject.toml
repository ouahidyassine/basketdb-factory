[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "basketdb"
version = "0.1.0"
description = "Pipeline ELT NBA : nba_api → PostgreSQL → dbt → Power BI, orchestré par Airflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nba_api>=1,<2",
    "pandas>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "requests>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]  # code jetable, hors du périmètre qualité

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]