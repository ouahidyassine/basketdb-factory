version: 2

models:
  - name: stg_team_games
    description: >
      Journal des matchs au niveau équipe, typé et renommé :
      une ligne par équipe et par match.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, team_id]
    columns:
      - name: game_id
        description: Identifiant du match, en texte pour conserver ses zéros initiaux.
        data_tests: [not_null]
      - name: team_id
        description: Identifiant de l'équipe.
        data_tests: [not_null]
      - name: season
        description: Saison au format 2015-16.
        data_tests: [not_null]
      - name: game_date
        description: Date du match.
        data_tests: [not_null]
      - name: is_home
        description: >
          Vrai si l'équipe reçoit (MATCHUP contient « vs. »). Faux pour les deux équipes
          des 10 matchs sur terrain neutre que la source signale depuis 2024-25 ;
          ces matchs seront repérés par is_neutral_site dans la couche intermediate.
        data_tests: [not_null]
      - name: opponent_abbreviation
        description: Abréviation de l'adversaire, extraite de MATCHUP.
        data_tests: [not_null]
      - name: is_win
        description: Vrai si l'équipe a gagné le match.
        data_tests: [not_null]
      - name: pts
        description: Points marqués par l'équipe.
        data_tests: [not_null]
