name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le projet et les outils de développement
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v

  dag-import:
    name: Import du DAG
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIRFLOW_VERSION: "3.3.2"
      PYTHON_VERSION: "3.12"
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml

      - name: Installer Airflow et pytest
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

      - name: Tester le DAG
        run: python -m pytest tests/dags --noconftest -q


